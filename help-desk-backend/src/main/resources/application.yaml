spring:
  application:
    name: help-desk-backend

  datasource:
    url: jdbc:mysql://localhost:3306/help-desk?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  ai:
    openai:
      base-url: "https://api.groq.com/openai/v1"
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: "qwen/qwen3.8-27b"
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: ALWAYS

server:
  port: 8081

logging:
  level:
    com.helpdesk: DEBUG
    org.springframework.ai.tool: DEBUG
    org.springframework.ai.chat.client.advisor: DEBUG
    org.hibernate.SQL: DEBUG
